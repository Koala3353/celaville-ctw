<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Celaville CTW</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- These URLs carry a personal token (?id=...) -- must never be indexed. -->
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FBF6EC">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<meta property="og:type" content="website">
<meta property="og:title" content="Celaville CTW">
<meta property="og:description" content="A thank-you letter for the team that ran the booth.">
<meta property="og:image" content="https://ctw.ateneoceladon.com/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Celaville CTW">
<meta name="twitter:description" content="A thank-you letter for the team that ran the booth.">
<meta name="twitter:image" content="https://ctw.ateneoceladon.com/og.png">

<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<!-- Keyboard-only entry point: invisible until focused, jumps straight past
     the loader chrome into the letter itself. #slides carries tabindex="-1"
     below so it's a valid, focusable jump target even though it's not
     natively interactive. -->
<a class="skip-link" href="#slides">Skip to letter</a>

<!-- The hand-drawn roughness filter, used by any card/button border that
     wants to read as inked rather than machine-drawn. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="rough-edge" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" />
    </filter>
  </defs>
</svg>

<div id="stage"><div id="frame">
  <!-- id="village" on this wrapper: app.js's revealFromLoader() still
       targets #village by that literal id, applying .ldr-fall/.ldr-land to
       it alongside slide 0 so they rise together as one motion on first
       load. Kept the id here (on the postmark's wrapper) rather than
       renaming it in app.js, since the postmark is this letter's one
       persistent piece of chrome -- it replaces the old village scene as
       the thing that "lands" with the first slide. -->
  <div id="village">
    <!-- A postmark medallion stamped in the corner of every page -- a small
         scalloped stamp shape plus a faint cancellation ring. -->
    <svg id="postmark" width="46" height="46" viewBox="0 0 46 46" aria-hidden="true">
      <circle class="pm-cancel" cx="23" cy="23" r="20" stroke-width="1.4"/>
      <path class="pm-cancel" d="M4 15 L42 15" stroke-width="1.2"/>
      <path class="pm-cancel" d="M4 31 L42 31" stroke-width="1.2"/>
      <rect x="9" y="9" width="28" height="28" rx="3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="2.4 2.6"/>
      <path d="M15 25 L20 18 L25 23 L31 14" fill="none" stroke="var(--coral)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>

  <div id="bars"></div>
  <div id="slides" tabindex="-1"></div>
  <!-- Screen-reader companion to the visual slide deck: app.js's show()
       writes each slide's kicker + heading here whenever the slide changes,
       so a reader following along by ear hears the same beats a sighted
       reader sees. Visually hidden (sr-only, see styles.css). -->
  <div id="slidelive" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <div id="hint">tap to continue &middot; hold to pause</div>

  <div id="loader" role="status" aria-live="polite">
    <div class="ldr-sky"></div>
    <div class="ldr-content">
      <div class="ldr-seal" aria-hidden="true">
        <svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <path d="M12 22 L17 14 L23 20 L28 11" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <p class="ldr-title">Preparing your letter<span class="ldr-dots" aria-hidden="true"><i></i><i></i><i></i></span></p>
      <div class="ldr-bar" aria-hidden="true"><i></i></div>
    </div>
    <div class="ldr-rush" aria-hidden="true"></div>
  </div>

  <!-- A real <dialog>, opened with showModal() (share.js) -- top-layer,
       Esc-to-close and focus-trapping come free from the element itself.
       ::backdrop + .sheet are the frosted-parchment treatment (styles.css). -->
  <dialog id="sharewrap">
    <div class="sheet">
      <img id="shareimg" alt="Your Celaville CTW card">
      <p class="hint" id="sharehint">Press and hold the image to save it, or use Share below.</p>
      <div class="srow">
        <button type="button" class="sbtn" id="sharenative" hidden onclick="event.stopPropagation()">Share</button>
        <a class="sbtn ghost" id="sharedl" download="celaville-ctw.png">Download</a>
      </div>
      <div class="srow" style="margin-top:9px">
        <span class="sbtn ghost" id="shareclose" role="button" tabindex="0">Close</span>
      </div>
    </div>
  </dialog>
</div></div>



<script src="assets/api.js"></script>
<script src="assets/stats.js"></script>
<script src="assets/slides.js"></script>
<script src="assets/share.js"></script>
<script src="assets/app.js"></script>
<script>
// Cache-first shell + offline second-open (sw.js). Registered from here,
// not app.js, so it stays out of the fetch-payload critical path entirely.
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
</script>
</body>
</html>
